name: Wide parity

# The large-scale check against the real game (parity/game-oracle/wide.sh):
# many random seeds, every dimension, compared with Chunkscope. Too slow for
# every pull request: it runs weekly, by hand ("Run workflow" in the Actions
# tab, with a seed count and salt), and before each release (release.yml
# calls it). Each run's differences, with seed and position, are in the job
# summary and in the "wide-parity" artifact.
on:
  schedule:
    - cron: "17 3 * * 1" # Mondays, 03:17 UTC
  workflow_dispatch:
    inputs:
      seeds:
        description: Random seeds to check
        default: "200"
      salt:
        description: Salt of the random seeds (empty for the date; reuse one to rerun the same seeds)
        default: ""
  workflow_call:
    inputs:
      seeds:
        type: string
        default: "200"
      salt:
        type: string
        default: ""
  pull_request:
    paths:
      - ".github/workflows/wide.yml"
      - "parity/game-oracle/WideOracle.java"
      - "parity/game-oracle/wide.sh"
      - "crates/mc-core/tests/wide.rs"

jobs:
  wide:
    name: Wide parity
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: parity/.cache/*/server.jar
          key: minecraft-server-jar-${{ hashFiles('parity/game-oracle/run.sh', 'parity/game-oracle/fetch.sh') }}
      - name: Run the game on random seeds and compare
        env:
          # A pull request that changes the check runs a short version of it.
          SEEDS: ${{ github.event_name == 'pull_request' && '10' || inputs.seeds || '200' }}
          SALT: ${{ inputs.salt }}
        run: |
          set -o pipefail
          parity/game-oracle/wide.sh "$SEEDS" "${SALT:-$(date -u +%Y%m%d)}" 10 | tee wide.log
      - name: Summary
        if: always()
        run: |
          {
            echo '## Wide parity'
            echo
            echo '```'
            cat parity/.cache/wide/SEEDS 2>/dev/null || true
            grep -E '^(==|[a-z_ ]+: [0-9]+ checked|  seed|test result)' wide.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wide-parity
          path: |
            wide.log
            parity/.cache/wide/SEEDS
            parity/.cache/wide/report-*.txt
          if-no-files-found: ignore
