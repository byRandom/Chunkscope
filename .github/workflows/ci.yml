name: CI

on:
  push:
  pull_request:

jobs:
  parity:
    name: Java parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21" # the JDK Minecraft 1.20.5+ ships with
      - name: Regenerate fixtures with the real JDK
        run: java parity/oracle/Oracle.java
      - name: Fixtures must be up to date
        run: git diff --exit-code -- parity/fixtures crates/java-compat/src/digit_table.rs

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
