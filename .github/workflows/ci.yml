name: CI

on:
  push:
  pull_request:

jobs:
  jdk-parity:
    name: JDK parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25" # the JDK Minecraft 26.x ships with
      - name: Regenerate fixtures with the real JDK
        run: java parity/oracle/Oracle.java
      - name: Fixtures must be up to date
        run: git diff --exit-code -- parity/fixtures crates/java-compat/src/digit_table.rs

  game-parity:
    name: Game parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/cache@v4
        with:
          path: parity/.cache
          key: minecraft-server-${{ hashFiles('parity/game-oracle/run.sh') }}
      - name: Regenerate fixtures with the real game
        run: parity/game-oracle/run.sh
      - name: Fixtures must be up to date
        run: git diff --exit-code -- parity/fixtures/game crates/mc-core/src/noise/vanilla.rs crates/mc-core/src/biome/generated.rs

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
