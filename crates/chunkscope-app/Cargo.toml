[package]
name = "chunkscope-app"
description = "Chunkscope desktop app: an interactive seed map for Minecraft: Java Edition"
edition.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true

[[bin]]
name = "chunkscope"
path = "src/main.rs"

[dependencies]
mc-core = { path = "../mc-core" }
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "persistence",
    "wayland",
    "x11",
] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
ron = "0.12"
